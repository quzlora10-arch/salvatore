<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvatore Yönetim</title><link rel="stylesheet" href="css/salvatore.css"></head><body><header class="top"><a class="brand" href="index.html">salvatore<span>●</span></a><div class="user"><button onclick="logout()">Çıkış</button></div></header><main class="main"><h1>Yönetim paneli</h1><div id="stats" class="stat-grid"></div><h2>Kullanıcılar</h2><div id="users">Yükleniyor...</div></main><script src="js/config.js"></script><script src="js/app.js"></script><script>if(!requireLogin()){}async function load(){try{const s=await api("/api/admin/stats");stats.innerHTML=`<div class="stat"><b>${s.users}</b>Kullanıcı</div><div class="stat"><b>${s.channels}</b>Kanal</div><div class="stat"><b>${s.videos}</b>Video</div><div class="stat"><b>${s.comments}</b>Yorum</div>`;const d=await api("/api/admin/users");users.innerHTML=`<table class="admin-table"><tr><th>Nickname</th><th>E-posta</th><th>Durum</th><th>İşlemler</th></tr>${d.users.map(u=>`<tr><td>@${esc(u.nickname)}</td><td>${esc(u.email)}</td><td>${u.active?"Aktif":"Kapalı"}</td><td>${u.role==="admin"?"Admin":`<button class="btn" onclick="toggleUser('${u.id}',${!u.active})">${u.active?"Kapat":"Aç"}</button> <button class="btn" onclick="changePass('${u.id}')">Şifre</button> <button class="btn danger" onclick="deleteUser('${u.id}')">Sil</button>`}</td></tr>`).join("")}</table>`}catch(e){users.textContent=e.message}}async function toggleUser(id,active){try{await api("/api/admin/users/"+id+"/status",{method:"PUT",body:{active}});load()}catch(e){alert(e.message)}}async function changePass(id){const p=prompt("Yeni şifre (en az 8 karakter):");if(!p)return;try{await api("/api/admin/users/"+id+"/password",{method:"PUT",body:{password:p}});alert("Şifre değiştirildi.")}catch(e){alert(e.message)}}async function deleteUser(id){if(!confirm("Bu kullanıcı ve kanal verileri silinsin mi?"))return;try{await api("/api/admin/users/"+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}load()</script></body></html>
