<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanal - Salvatore</title><link rel="stylesheet" href="css/salvatore.css"></head><body><header class="top"><a class="brand" href="index.html">salvatore<span>●</span></a><form class="search" action="search.html"><input name="q" placeholder="Ara"><button>⌕</button></form><div id="userBox" class="user"></div></header><main class="main"><div id="channel"></div></main><script src="js/config.js"></script><script src="js/app.js"></script><script>const handle=new URLSearchParams(location.search).get("handle");api("/api/channels/"+encodeURIComponent(handle||"")).then(d=>{channel.innerHTML=`<section class="channel-head"><div class="avatar">${esc((d.channel.name||"S").charAt(0).toUpperCase())}</div><div><h1>${esc(d.channel.name)}</h1><p>@${esc(d.channel.handle)} · ${d.channel.subscribers} abone</p><p>${esc(d.channel.description)}</p></div></section><div class="grid">${d.videos.map(videoCard).join("")||"Bu kanalda henüz video yok."}</div>`}).catch(e=>channel.textContent=e.message)</script></body></html>
