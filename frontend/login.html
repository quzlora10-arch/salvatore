<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş - Salvatore</title><link rel="stylesheet" href="css/salvatore.css"></head><body><div class="box"><a class="brand" href="index.html">salvatore<span>●</span></a><h1>Giriş yap</h1><div id="msg" class="msg"></div><form id="form"><div class="field"><label>E-posta</label><input id="email" type="email" required></div><div class="field"><label>Şifre</label><input id="password" type="password" required></div><button class="btn">Giriş yap</button></form><p>Hesabın yok mu? <a href="register.html"><u>Kayıt ol</u></a></p></div><script src="js/config.js"></script><script src="js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.style.display="block";try{const d=await api("/api/auth/login",{method:"POST",body:{email:email.value,password:password.value}});setSession(d);location.href="index.html"}catch(x){msg.textContent=x.message}}</script></body></html>
