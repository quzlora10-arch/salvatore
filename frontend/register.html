<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hesap oluştur - Salvatore</title><link rel="stylesheet" href="css/salvatore.css"></head><body><div class="box"><a class="brand" href="index.html">salvatore<span>●</span></a><h1>Salvatore hesabı oluştur</h1><div id="msg" class="msg"></div><form id="form"><div class="field"><label>Hotmail / Outlook / E-posta</label><input id="email" type="email" required></div><div class="field"><label>Nickname</label><input id="nickname" pattern="[A-Za-z0-9_.-]{3,30}" required></div><div class="field"><label>Şifre</label><input id="password" type="password" minlength="8" required></div><button class="btn">Doğrulama kodu gönder</button></form></div><script src="js/config.js"></script><script src="js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.style.display="block";try{const d=await api("/api/auth/register",{method:"POST",body:{email:email.value,nickname:nickname.value,password:password.value}});sessionStorage.setItem("salvatore_verify_email",email.value);msg.textContent=d.message;setTimeout(()=>location.href="verify.html",700)}catch(x){msg.textContent=x.message}}</script></body></html>
