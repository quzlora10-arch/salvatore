<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video yükle - Salvatore</title><link rel="stylesheet" href="css/salvatore.css"></head><body><div class="box"><a class="brand" href="index.html">salvatore<span>●</span></a><h1>Video yükle</h1><div id="msg" class="msg"></div><form id="form"><div class="field"><label>Başlık</label><input id="title" required></div><div class="field"><label>Açıklama</label><textarea id="description" rows="5"></textarea></div><div class="field"><label>Video</label><input id="video" type="file" accept="video/*" required></div><button class="btn">Yükle</button></form></div><script src="js/config.js"></script><script src="js/app.js"></script><script>if(!requireLogin()){}form.onsubmit=async e=>{e.preventDefault();msg.style.display="block";const fd=new FormData();fd.append("title",title.value);fd.append("description",description.value);fd.append("video",video.files[0]);try{await api("/api/videos",{method:"POST",body:fd});msg.textContent="Video yüklendi.";setTimeout(()=>location.href="index.html",800)}catch(x){msg.textContent=x.message}}</script></body></html>
