<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-posta doğrulama - Salvatore</title><link rel="stylesheet" href="css/salvatore.css"></head><body><div class="box"><a class="brand" href="index.html">salvatore<span>●</span></a><h1>E-postanı doğrula</h1><p>6 haneli kodu e-posta kutuna gönderilen mesajdan gir.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>E-posta</label><input id="email" type="email" required></div><div class="field"><label>Doğrulama kodu</label><input id="code" inputmode="numeric" maxlength="6" required></div><button class="btn">Hesabı tamamla</button></form></div><script src="js/config.js"></script><script src="js/app.js"></script><script>email.value=sessionStorage.getItem("salvatore_verify_email")||"";form.onsubmit=async e=>{e.preventDefault();msg.style.display="block";try{const d=await api("/api/auth/verify",{method:"POST",body:{email:email.value,code:code.value}});setSession(d);sessionStorage.removeItem("salvatore_verify_email");location.href="index.html"}catch(x){msg.textContent=x.message}}</script></body></html>
