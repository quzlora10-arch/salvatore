<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video - Salvatore</title><link rel="stylesheet" href="css/salvatore.css"></head><body><header class="top"><a class="brand" href="index.html">salvatore<span>●</span></a><form class="search" action="search.html"><input name="q" placeholder="Ara"><button>⌕</button></form><div id="userBox" class="user"></div></header><main class="main watch"><div id="content">Yükleniyor...</div></main><script src="js/config.js"></script><script src="js/app.js"></script><script>const idv=new URLSearchParams(location.search).get("id");api("/api/videos/"+encodeURIComponent(idv||"")).then(d=>{content.innerHTML=`<video class="player" controls src="${API}/uploads/${encodeURIComponent(d.video.filename)}"></video><h1>${esc(d.video.title)}</h1><p>${d.video.views.toLocaleString("tr-TR")} görüntüleme · ${new Date(d.video.createdAt).toLocaleDateString("tr-TR")}</p><p>${esc(d.video.description)}</p><p><a class="btn" href="channel.html?handle=${encodeURIComponent(d.channel.handle)}">${esc(d.channel.name)}</a> <button class="btn" id="like">♥ ${d.video.likes}</button></p><div class="comments"><h2>Yorumlar</h2><div id="commentForm"></div><div id="comments">${d.comments.map(c=>`<div class="comment"><b>@${esc(c.nickname)}</b><br>${esc(c.text)}</div>`).join("")||"Henüz yorum yok."}</div></div>`;if(token()){commentForm.innerHTML='<form id="cf"><input id="ct" placeholder="Yorum yaz..." style="width:70%;padding:12px"><button class="btn">Gönder</button></form>';cf.onsubmit=async e=>{e.preventDefault();try{await api("/api/videos/"+idv+"/comments",{method:"POST",body:{text:ct.value}});location.reload()}catch(x){alert(x.message)}};like.onclick=async()=>{try{const x=await api("/api/videos/"+idv+"/like",{method:"POST"});like.textContent="♥ "+x.likes}catch(x){alert(x.message)}}}}).catch(e=>content.textContent=e.message)</script></body></html>
