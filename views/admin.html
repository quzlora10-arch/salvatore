<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvatore Yönetim Paneli</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="logo" href="/">SALVATORE ADMIN</a><a href="/" style="color:#fff">Siteye dön</a></header><main><div id="login"><div class="card" style="margin:50px auto"><h2>Yönetici Girişi</h2><input id="identifier" placeholder="Admin e-posta/nickname"><input id="password" type="password" placeholder="Şifre"><button onclick="login()">Giriş</button><p class="muted">Varsayılan: admin@salvatore.local / ChangeMe123!</p></div></div><div id="panel" class="hidden"><h1>Yönetim Paneli</h1><div id="stats" class="grid"></div><h2>Kullanıcılar</h2><div id="users"></div><h2>Videolar</h2><div id="vids"></div></div></main><script>
function $(s){return document.querySelector(s)}function api(u,o){return fetch(u,o||{}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||"Hata");return d;});});}
function login(){api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier:$("#identifier").value,password:$("#password").value})}).then(function(d){if(!d.isAdmin)throw Error("Yönetici yetkisi yok.");$("#login").classList.add("hidden");$("#panel").classList.remove("hidden");load();}).catch(function(e){alert(e.message);});}
function load(){api("/api/admin/stats").then(function(s){$("#stats").innerHTML='<div class="video info">Üye: '+s.users+'</div><div class="video info">Video: '+s.videos+'</div><div class="video info">İzlenme: '+s.views+'</div><div class="video info">Yorum: '+s.comments+'</div>';return api("/api/admin/users");}).then(function(u){$("#users").innerHTML=u.map(function(x){return '<div class="video info" style="margin:8px 0">'+x.id+' — '+x.email+' — <b>'+x.nickname+'</b> — '+(x.is_admin?"ADMIN":"ÜYE")+' <button onclick="resetPass('+x.id+')">Şifre değiştir</button> <button onclick="delUser('+x.id+')">Sil</button></div>';}).join("");return api("/api/admin/videos");}).then(function(v){$("#vids").innerHTML=v.map(function(x){return '<div class="video info" style="margin:8px 0">'+x.id+' — '+x.title+' — '+x.nickname+' — '+x.views+' izlenme <button onclick="delVideo('+x.id+')">Sil</button></div>';}).join("");}).catch(function(e){alert(e.message);});}
function resetPass(id){var p=prompt("Yeni şifre (en az 8 karakter):");if(!p)return;api("/api/admin/users/"+id+"/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})}).then(function(){alert("Şifre değiştirildi.");}).catch(function(e){alert(e.message);});}
function delUser(id){if(!confirm("Üye silinsin mi?"))return;api("/api/admin/users/"+id,{method:"DELETE"}).then(load);}
function delVideo(id){if(!confirm("Video silinsin mi?"))return;api("/api/admin/videos/"+id,{method:"DELETE"}).then(load);}
</script></body></html>
